name: Deploy to EC2 with Docker

on:
  push:
    branches: [ "develop" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # [보안 경고] Docker Hub 리포지토리가 Private인지 꼭 확인해라!
      - name: Create dev-secret.yml
        shell: bash
        run: |
          mkdir -p ./src/main/resources
          echo "${{ secrets.DEV_SECRET_YML }}" > ./src/main/resources/dev-secret.yml
          ls -al ./src/main/resources

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew build -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/weterview-server:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/weterview-server:latest

      # [개선] 배포 스크립트 최적화 (Zero Downtime에 가깝게)
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            # 1. [중요] 새 이미지를 '먼저' 받는다. (서버가 살아있는 상태에서 진행됨)
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/weterview-server:latest

            # 2. 기존 컨테이너 중지 및 삭제 (다운타임 시작 - 최소화)
            sudo docker stop weterview-server || true
            sudo docker rm weterview-server || true

            # 3. 새 컨테이너 실행 (다운타임 종료)
            # --network host 등 필요한 네트워크 설정이 있다면 추가
            sudo docker run -d --name weterview-server -p 8080:8080 ${{ secrets.DOCKER_USERNAME }}/weterview-server:latest

            # 4. 미사용 이미지 정리 (공간 확보)
            sudo docker image prune -f